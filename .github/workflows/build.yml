name: Build & Publish Scripts

on:
  push:
    branches:
      - '**'
    paths:
      - '**'
 
  workflow_dispatch:
    inputs:
      reason:
        description: '触发原因（如：SDK 升级后全量重编译）'
        required: false

jobs:
  test-and-build:
    runs-on: self-hosted

    env:
      MASTER_URL: ${{ secrets.MASTER_URL || 'http://localhost:8090' }}
      COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
      COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      COS_BUCKET: ${{ secrets.COS_BUCKET }}
      COS_REGION: ${{ secrets.COS_REGION }}
      GOPRIVATE: "github.com/A0dongq1N/*"
      GOPROXY: "direct"
      # GIT_TERMINAL_PROMPT=0 禁用 Git clone/pull/push 时的命令行认证交互（遇到认证失败直接报错，不弹交互输密码）
      GIT_TERMINAL_PROMPT: "0"
      GOPATH: "/root/go"
      GOMODCACHE: "/root/go/pkg/mod"
      HOME: "/root"

    steps:
      - uses: actions/checkout@v5

      - name: Configure git for private modules
        run: |
          echo "machine github.com login x-access-token password ${PRIVATE_PAT}" > ~/.netrc
          chmod 600 ~/.netrc
          git ls-remote https://github.com/A0dongq1N/jarvan4-platform.git HEAD
        env:
          PRIVATE_PAT: ${{ secrets.PRIVATE_PAT }}

      # 拉取 platform（含 scriptrun）；独立二进制后无需与 Worker 指纹对齐
      - name: Clone jarvan4-platform (latest main)
        run: |
          rm -rf /tmp/jarvan4-platform
          git clone --depth 1 https://github.com/A0dongq1N/jarvan4-platform.git /tmp/jarvan4-platform
          go mod edit -replace github.com/A0dongq1N/jarvan4-platform=/tmp/jarvan4-platform
          go mod edit -replace github.com/A0dongq1N/jarvan4-platform/pb=/tmp/jarvan4-platform/pb
          go mod tidy

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build all scripts
        run: |
          mkdir -p dist
          COMMIT_HASH="${GITHUB_SHA}"
          for d in scripts/*/; do
            [ -f "$d/main.go" ] || continue
            name=$(basename "$d")
            [[ "$name" == _* ]] && continue
            echo "🔨 编译 $name ..."
            mkdir -p "dist/${name}"
            go build -o "dist/${name}/${COMMIT_HASH}" "./$d"
            echo "✓ dist/${name}/${COMMIT_HASH}"
          done

      - name: Upload to COS & Notify Master
        run: |
          COMMIT_HASH="${GITHUB_SHA}"
          COMMIT_MSG=$(git log -1 --pretty=format:'%s')
          AUTHOR=$(git log -1 --pretty=format:'%an')
          BRANCH="${GITHUB_REF_NAME}"

          pip install coscmd -q
          coscmd config \
            -a "$COS_SECRET_ID" \
            -s "$COS_SECRET_KEY" \
            -b "$COS_BUCKET" \
            -r "$COS_REGION"

          for d in scripts/*/; do
            [ -f "$d/main.go" ] || continue
            name=$(basename "$d")
            [[ "$name" == _* ]] && continue
            BIN_FILE="dist/${name}/${COMMIT_HASH}"
            if [ ! -f "$BIN_FILE" ]; then
              echo "⚠️  $BIN_FILE 不存在，跳过上传"
              continue
            fi

            COS_KEY_LATEST="scripts/${name}/${name}"
            PREV="/tmp/prev-${name}"
            rm -f "$PREV"
            # 和已发布的正式包逐字节比较。相同则不重复上传，发布记录指向已有对象。
            ARTIFACT_URL=""
            if coscmd download "$COS_KEY_LATEST" "$PREV" && cmp -s "$PREV" "$BIN_FILE"; then
              echo "✓ $name 二进制未变化，跳过上传"
              ARTIFACT_URL="$COS_KEY_LATEST"
            else
              COS_KEY_VERSIONED="scripts/${name}/${COMMIT_HASH}"
              echo "⬆️  上传 $BIN_FILE → cos://${COS_BUCKET}/${COS_KEY_VERSIONED}"
              coscmd upload "$BIN_FILE" "$COS_KEY_VERSIONED"
              ARTIFACT_URL="$COS_KEY_VERSIONED"
              if [ "$BRANCH" = "main" ]; then
                echo "⬆️  上传 $BIN_FILE → cos://${COS_BUCKET}/${COS_KEY_LATEST} (release)"
                coscmd upload "$BIN_FILE" "$COS_KEY_LATEST"
                ARTIFACT_URL="$COS_KEY_LATEST"
              fi
            fi

            echo "📡 通知 Master: name=$name branch=$BRANCH commitHash=${COMMIT_HASH:0:12}"
            HTTP_CODE=$(curl -s -o /tmp/publish_resp.json -w "%{http_code}" \
              -X POST "${MASTER_URL}/api/internal/scripts/publish" \
              -H "Content-Type: application/json" \
              -d "{
                \"name\": \"${name}\",
                \"commitHash\": \"${COMMIT_HASH}\",
                \"artifactUrl\": \"${ARTIFACT_URL}\",
                \"commitMsg\": \"${COMMIT_MSG}\",
                \"author\": \"${AUTHOR}\",
                \"branch\": \"${BRANCH}\",
                \"sourceRepo\": \"${{ github.server_url }}/${{ github.repository }}\",
                \"sourcePath\": \"scripts/${name}/main.go\"
              }")

            if [ "$HTTP_CODE" = "200" ]; then
              RESP_CODE=$(python3 -c "import json,sys; print(json.load(open('/tmp/publish_resp.json'))['code'])")
              if [ "$RESP_CODE" = "0" ]; then
                echo "✓ Master 已更新脚本 $name"
              else
                echo "✗ Master 返回业务错误: $(cat /tmp/publish_resp.json)"
                exit 1
              fi
            else
              echo "✗ Master 通知失败，HTTP $HTTP_CODE: $(cat /tmp/publish_resp.json)"
              exit 1
            fi
          done
